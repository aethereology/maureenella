name: Audit branch dependency refresh
on:
  push:
    branches: [fix/production-hardening-2026-10-27]
    paths: [package.json, .github/workflows/audit-bootstrap.yml, scripts/apply-audit-fixes.py]
permissions:
  contents: write
concurrency:
  group: audit-bootstrap
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'aethereology/maureenella' && github.ref == 'refs/heads/fix/production-hardening-2026-10-27'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-hardening-2026-10-27
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Apply narrowly scoped source adjustments if present
        run: |
          if [ -f scripts/apply-audit-fixes.py ]; then python3 scripts/apply-audit-fixes.py; fi
      - name: Regenerate dependency lock without install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit generated files only to the audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- . ':!.github'
          if ! git diff --cached --quiet; then
            git commit -m 'Apply audit adjustments and refresh patched dependency lock'
            git push origin HEAD:fix/production-hardening-2026-10-27
          fi
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Export source and dependency evidence
        if: always()
        run: |
          mkdir -p audit-artifacts
          git archive --format=tar.gz -o audit-artifacts/source.tar.gz HEAD
          npm ls next react react-dom sharp > audit-artifacts/dependencies.txt 2>&1 || true
          npm audit --json > audit-artifacts/npm-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-bootstrap-evidence
          path: audit-artifacts/
          retention-days: 7
